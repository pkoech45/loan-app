
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Verification Code</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
}

.yellow-background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 53%;
    background: #ffe600;
    border-radius: 0 0 35px 35px;
}

.verification-container {
    position: relative;
    width: calc(100% - 32px);
    max-width: 480px;
    margin: 0 auto;
    top: 45vh;
    transform: translateY(-50%);
    border-radius: 17px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0,0,0,.18);
    background: white;
}

.header {
    background: #777;
    color: white;
    padding: 20px 17px;
    font-size: 25px;
    font-weight: bold;
    font-style: italic;
}

.form-content {
    padding: 22px 17px 28px;
    background: white;
}

.demo-label {
    color: #8a5b00;
    background: #fff4cf;
    padding: 9px;
    border-radius: 6px;
    font-size: 12px;
    text-align: center;
    margin-bottom: 15px;
}

.description {
    color: #666;
    font-size: 14px;
    font-style: italic;
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 23px;
    margin-bottom: 16px;
}

input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #777;
    padding: 12px 5px;
    font-size: 22px;
    outline: none;
    margin-bottom: 12px;
}

input:focus {
    border-bottom: 2px solid #0645a5;
}

.message {
    display: none;
    padding: 11px;
    border-radius: 25px;
    text-align: center;
    font-weight: bold;
    margin-bottom: 14px;
}

.error {
    background: #ed1745;
    color: white;
}

.success {
    background: #168a50;
    color: white;
}

button {
    display: block;
    width: 90%;
    margin: 0 auto;
    background: #0645a5;
    color: white;
    border: none;
    border-radius: 16px;
    padding: 19px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
}

button:disabled {
    opacity: .7;
    cursor: default;
}
</style>
</head>

<body>

<div class="yellow-background"></div>

<div class="verification-container">

    <div class="header">
        Confirm OTP
    </div>

    <div class="form-content">

        <div class="demo-label">
            DEMO VERIFICATION — NOT A REAL OTP SERVICE
        </div>

        <div class="description">
            Enter any verification code to test this demonstration.
        </div>

        <form id="verificationForm">

            <label for="verificationCode">Enter OTP</label>

            <input
                type="text"
                id="verificationCode"
                placeholder="Enter verification code"
                autocomplete="off"
                required
            >

            <div id="errorMessage" class="message error">
                Verification code is required
            </div>

            <div id="successMessage" class="message success">
                Demo verification successful!
            </div>

            <button type="submit" id="confirmButton">
                Confirm OTP
            </button>

        </form>

    </div>
</div>

<script>
document.getElementById("verificationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const code = document.getElementById("verificationCode").value.trim();
    const error = document.getElementById("errorMessage");
    const success = document.getElementById("successMessage");

    error.style.display = "none";
    success.style.display = "none";

    if (!code) {
        error.style.display = "block";
        return;
    }

    success.style.display = "block";

});
</script>

</body>
</html>
